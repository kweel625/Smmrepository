<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="Society of Mathematics Major seal">
  <defs>
    <radialGradient id="seal-green" cx="42%" cy="30%" r="82%">
      <stop offset="0" stop-color="#5cff80"/>
      <stop offset="0.5" stop-color="#1bfb48"/>
      <stop offset="1" stop-color="#00d92c"/>
    </radialGradient>
    <path id="seal-arc" d="M 67 422 A 300 300 0 0 1 653 422" fill="none"/>
  </defs>

  <!-- green disc -->
  <circle cx="360" cy="360" r="352" fill="url(#seal-green)"/>
  <!-- double black ring -->
  <circle cx="360" cy="360" r="350" fill="none" stroke="#000" stroke-width="7"/>
  <circle cx="360" cy="360" r="318" fill="none" stroke="#000" stroke-width="5"/>

  <!-- curved seal text -->
  <text font-family="'Times New Roman', Times, Georgia, serif" font-size="42" font-weight="700"
        fill="#000" letter-spacing="1">
    <textPath href="#seal-arc" startOffset="50%" text-anchor="middle" textLength="688" lengthAdjust="spacing">SOCIETY OF MATHEMATICS MAJOR</textPath>
  </text>

  <!-- monogram -->
  <g fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(360 412) scale(0.88) translate(-360 -360)">
    <!-- central stem with curls (integral form) -->
    <path d="M 436 168 C 436 128 388 118 370 152 C 363 166 362 182 362 202 L 362 486 C 362 538 342 570 312 574 C 290 577 279 559 285 536"/>
    <!-- upper right bar with downward hook -->
    <path d="M 382 248 L 494 248 C 518 248 526 266 519 282"/>
    <!-- lower right bar with upward hook -->
    <path d="M 382 460 L 494 460 C 518 460 526 442 519 426"/>
    <!-- left wedge -->
    <path d="M 350 236 L 222 354 L 352 472"/>
    <!-- left and right loops -->
    <circle cx="262" cy="354" r="84"/>
    <circle cx="458" cy="354" r="84"/>
  </g>
</svg>
