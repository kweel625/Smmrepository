<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a11">
<title>SMM Attendance Tracker</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #061a11;
    --bg-glow: #0d3b27;
    --panel: #0d2a1e;
    --panel-2: #113325;
    --line: #1e4c37;
    --text: #eaf6ee;
    --muted: #a7c4b3;
    --brand: #2fe36b;
    --brand-2: #17b452;
    --brand-deep: #0b7a3a;
    --ok: #17b96a;
    --warn: #d9a02a;
    --bad: #cf4b4b;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background:
      radial-gradient(1100px 620px at 50% -12%, #16583a 0%, transparent 62%),
      radial-gradient(760px 520px at 100% 102%, #0f4c31 0%, transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display:flex; flex-direction:column; gap:16px;
    min-height:100dvh; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
  }

  /* ---------- header ---------- */
  header { display:flex; align-items:center; gap:14px; padding:2px 2px 4px; }
  .logo {
    width:56px; height:56px; flex:none; border-radius:50%;
    box-shadow:0 0 0 3px rgba(47,227,107,.25), 0 8px 22px -10px #000;
    background:#0b3a22;
  }
  .brand { min-width:0; }
  .brand h1 {
    margin:0; font-family:"Sora", system-ui, sans-serif; font-weight:700;
    font-size:1.06rem; line-height:1.2; letter-spacing:.055em; text-transform:uppercase;
    color:#f3fff7;
  }
  .brand h1 span { color:var(--brand); }
  .brand p {
    margin:3px 0 0; font-size:.78rem; letter-spacing:.13em; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }
  .live {
    margin-left:auto; display:flex; align-items:center; gap:7px; flex:none;
    font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--brand); background:rgba(47,227,107,.1);
    border:1px solid rgba(47,227,107,.28); padding:7px 11px; border-radius:999px;
  }
  .live i { width:7px; height:7px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 0 rgba(47,227,107,.55); animation:pulse 2.4s infinite; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(47,227,107,.5); }
    70% { box-shadow:0 0 0 9px rgba(47,227,107,0); }
    100% { box-shadow:0 0 0 0 rgba(47,227,107,0); }
  }

  /* ---------- camera stage ---------- */
  #stage {
    position:relative; overflow:hidden;
    border-radius:var(--radius);
    background:
      radial-gradient(120% 90% at 50% 0%, #10402c 0%, #05120c 78%);
    border:1px solid var(--line);
    min-height:230px; display:grid; place-items:center;
    box-shadow:0 24px 48px -30px #000, inset 0 1px 0 rgba(255,255,255,.05);
  }
  #stage::before {
    content:""; position:absolute; inset:14px; border-radius:12px; pointer-events:none;
    background:
      linear-gradient(to right, var(--brand) 0 26px, transparent 26px calc(100% - 26px), var(--brand) calc(100% - 26px)) top left / 100% 2px no-repeat,
      linear-gradient(to right, var(--brand) 0 26px, transparent 26px calc(100% - 26px), var(--brand) calc(100% - 26px)) bottom left / 100% 2px no-repeat,
      linear-gradient(to bottom, var(--brand) 0 26px, transparent 26px calc(100% - 26px), var(--brand) calc(100% - 26px)) top left / 2px 100% no-repeat,
      linear-gradient(to bottom, var(--brand) 0 26px, transparent 26px calc(100% - 26px), var(--brand) calc(100% - 26px)) top right / 2px 100% no-repeat;
    opacity:.75;
  }
  #reader { width:100%; }
  #reader video { display:block; border-radius:var(--radius); }

  button {
    font:inherit; font-weight:700; cursor:pointer;
    transition:transform .12s ease, box-shadow .18s ease, filter .18s ease;
  }
  #start {
    position:relative; z-index:1;
    font-family:"Sora", system-ui, sans-serif; letter-spacing:.02em;
    font-size:1.02rem; padding:15px 28px; border:0; border-radius:999px;
    color:#04180d;
    background:linear-gradient(180deg, #5df78f, var(--brand) 45%, var(--brand-2));
    box-shadow:0 12px 26px -12px rgba(47,227,107,.85), inset 0 1px 0 rgba(255,255,255,.45);
  }
  #start:hover { filter:brightness(1.05); transform:translateY(-1px); }
  #start:active { transform:translateY(1px) scale(.995); }
  button:focus-visible { outline:3px solid var(--brand); outline-offset:3px; }

  /* ---------- status ---------- */
  #status {
    flex:1 1 auto; min-height:172px; max-height:360px; border-radius:var(--radius);
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    padding:22px 22px 22px 26px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  #status::after {
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:linear-gradient(180deg, var(--brand), var(--brand-deep));
    transition:background .2s ease;
  }
  #status .label {
    font-size:.7rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--brand); margin-bottom:10px;
  }
  #title {
    font-family:"Sora", system-ui, sans-serif; font-weight:700;
    font-size:1.7rem; line-height:1.2; overflow-wrap:anywhere; letter-spacing:-.01em;
  }
  #sub { margin-top:10px; font-size:1rem; line-height:1.45; color:var(--muted); }

  #status.ok { background:linear-gradient(160deg, #1ed374, #0f9d55); border-color:transparent; color:#03170c; }
  #status.ok .label, #status.ok #sub { color:rgba(3,23,12,.72); }
  #status.ok::after { background:rgba(3,23,12,.35); }
  #status.warn { background:linear-gradient(160deg, #e8b342, #c98f16); border-color:transparent; color:#22170a; }
  #status.warn .label, #status.warn #sub { color:rgba(34,23,10,.72); }
  #status.warn::after { background:rgba(34,23,10,.35); }
  #status.bad { background:linear-gradient(160deg, #dc5a5a, #a83434); border-color:transparent; color:#fff5f5; }
  #status.bad .label, #status.bad #sub { color:rgba(255,245,245,.78); }
  #status.bad::after { background:rgba(255,245,245,.35); }

  /* ---------- footer stats ---------- */
  footer { display:flex; align-items:center; gap:10px; font-size:.86rem; margin-top:auto; padding-top:2px; }
  .stat {
    display:flex; align-items:center; gap:8px;
    background:rgba(17,51,37,.72); border:1px solid var(--line);
    border-radius:999px; padding:9px 14px; color:var(--muted); font-weight:700;
    letter-spacing:.02em;
  }
  .stat b { color:var(--text); font-family:"Sora", system-ui, sans-serif; font-size:.95rem; }
  .stat .dot { width:8px; height:8px; border-radius:50%; background:var(--brand); }
  #queue:empty { display:none; }
  #queue { color:var(--warn); background:rgba(217,160,42,.1); border-color:rgba(217,160,42,.35); }

  @media (min-width:600px) {
    main { padding:28px 24px 28px; gap:18px; }
    #title { font-size:2rem; }
    .brand h1 { font-size:1.2rem; }
    .logo { width:64px; height:64px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="logo.svg" alt="Society of Mathematics Major logo" width="56" height="56">
    <div class="brand">
      <h1>SMM <span>Attendance</span> Tracker</h1>
      <p>Society of Mathematics Major</p>
    </div>
    <div class="live"><i></i>Live</div>
  </header>

  <div id="stage">
    <div id="reader" style="width:100%"></div>
    <button id="start">Start scanning</button>
  </div>

  <section id="status" aria-live="polite">
    <div class="label">Scanner status</div>
    <div id="title">Ready to scan</div>
    <div id="sub">Tap Start, then hold an ID barcode in the box.</div>
  </section>

  <footer>
    <span class="stat" id="count"><span class="dot"></span>Scanned: <b>0</b></span>
    <span class="stat" id="queue"></span>
  </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsQnI4AwVLwDZmBQ0s7j6SOmIvCBv0LDFKuHFQK77v66mbeYNJ55z31GWK_--2p0A/exec';

const $ = id => document.getElementById(id);
const F = Html5QrcodeSupportedFormats;
let key = localStorage.getItem('key');
let queue = JSON.parse(localStorage.getItem('queue') || '[]');
let count = 0, flushing = false, lastCode = '', lastAt = 0;
const ac = new (window.AudioContext || window.webkitAudioContext)();

function askKey() { key = prompt('Enter the scanner passcode') || ''; localStorage.setItem('key', key); }
function setCount() { $('count').innerHTML = '<span class="dot"></span>Scanned: <b>' + count + '</b>'; }
function saveQueue() { localStorage.setItem('queue', JSON.stringify(queue)); $('queue').textContent = queue.length ? queue.length + ' waiting to send' : ''; }
function beep(freq) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = freq; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.18);
}
function show(cls, title, sub, freq) {
  $('status').className = cls; $('title').textContent = title; $('sub').textContent = sub;
  $('status').querySelector('.label').textContent = cls === 'ok' ? 'Verified' : cls === 'warn' ? 'Heads up' : cls === 'bad' ? 'Problem' : 'Scanner status';
  beep(freq); if (navigator.vibrate) navigator.vibrate(cls === 'ok' ? 80 : [80, 60, 80]);
}

async function flush() {
  if (flushing) return;
  flushing = true;
  while (queue.length) {
    const item = queue[0];
    let r;
    try {
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ ...item, key }) });
      r = await res.json();
    } catch (e) { $('queue').textContent = queue.length + ' waiting (offline)'; break; }
    if (r.status === 'auth') { askKey(); continue; }
    queue.shift(); saveQueue();
    if (r.status === 'ok') {
      count++; setCount();
      r.name ? show('ok', r.name, 'ID ' + item.id + ' recorded', 880)
             : show('warn', 'Not in roster', 'ID ' + item.id + ' recorded anyway', 440);
    } else if (r.status === 'dup') show('warn', 'Already scanned', (r.name || 'ID ' + item.id), 440);
    else if (r.status === 'closed') { show('bad', 'Attendance is closed', 'Ask the organizer to reopen it.', 220); queue = []; saveQueue(); }
    else show('bad', 'Something went wrong', 'Try scanning again.', 220);
  }
  flushing = false;
}

function onScan(text) {
  const id = text.trim(), now = Date.now();
  if (id === lastCode && now - lastAt < 4000) return; // ignore the same card held in view
  lastCode = id; lastAt = now;
  queue.push({ id, ts: now }); saveQueue(); flush();
}

const scanner = new Html5Qrcode('reader', {
  formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.ITF, F.UPC_A, F.CODABAR, F.QR_CODE],
  experimentalFeatures: { useBarCodeDetectorIfSupported: true },
  verbose: false
});
$('start').onclick = async () => {
  if (!key) askKey();
  ac.resume();
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 290, height: 120 } }, onScan, () => {});
    $('start').hidden = true; flush();
  } catch (e) { show('bad', 'Camera blocked', 'Allow camera access in the browser settings, then tap Start again.', 220); }
};
window.addEventListener('online', flush);
saveQueue();
</script>
</body>
</html>
